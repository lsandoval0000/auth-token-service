quarkus.http.port=8081

# --- JWT keys -----------------------------------------------------------
# Classpath resource names are dev defaults only. In deployed environments set
# JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION to absolute file paths
# (e.g. /deployments/keys/privateKey.pem) or to classpath: resources.
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=token-api

# --- Database -----------------------------------------------------------
# Credentials come from the environment. Defaults below are local-only
# throwaway values so `quarkus:dev` can boot; they are NOT real credentials.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/abc_bank}

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.log.console.level=DEBUG

# --- Registered API clients --------------------------------------------
# Client secrets are supplied by the environment. The default is a
# non-functional placeholder; never commit a real secret here.
app.clients.exchange-rate-informer.secret=${EXCHANGE_RATE_INFORMER_SECRET:change-me-dev-only}
