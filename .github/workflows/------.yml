name: Create Release on PR Merge.

on:
  pull_request: 
    types:
      - closed
    branches:
      - main
    
jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted
    
    permissions: write-all
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build Quarkus Application
        run: mvn clean package
        
      - name: Package Release Assets
        run: |
          mkdir -p release-artifacts
          cp -r target/quarkus-app/* release-artifacts/
          tar -czvf quarkus-app.tar.gz -C release-artifacts .
          
      - name: Extract Version from POM
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}-${{ github.event.pull_request.number }}
          name: Release v${{ env.VERSION }}
          body: |
            Automated release generated from merged Pull Request #${{ github.event.pull_request.number }}.
            
            **PR Title:** ${{ github.event.pull_request.title }}
            **Merged By:** ${{ github.event.pull_request.user.login }}
          draft: false
          prerelease: false
          files: |
            ./quarkus-app.tar.gz
